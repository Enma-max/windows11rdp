name: Windows 11 RDP (Ngrok)

on:
  workflow_dispatch:

jobs:
  rdp-access:
    runs-on: windows-latest

    steps:
    - name: Enable RDP & Firewall
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set User Password
      run: |
        $pass = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $pass

    - name: Download and Install Ngrok
      run: |
        curl -L -o ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip
        Expand-Archive -Path ngrok.zip -DestinationPath .

    - name: Start Ngrok Tunnel
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        .\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 15

    - name: Get RDP Info
      run: |
        $max = 15
        $i = 0
        while ($i -lt $max) {
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:4040/api/tunnels" -UseBasicParsing
            $data = $response.Content | ConvertFrom-Json
            if ($data.tunnels.Count -gt 0) {
              $url = $data.tunnels[0].public_url -replace "tcp://", ""
              Write-Host "========================================="
              Write-Host "RDP INFO:"
              Write-Host "Address: $url"
              Write-Host "User: runneradmin"
              Write-Host "Pass: P@ssw0rd!"
              Write-Host "========================================="
              exit 0
            }
          } catch {}
          Start-Sleep -Seconds 3
          $i++
        }
        Write-Host "Ngrok tunnel not found. Trying ngrok.log..."
        Get-Content ngrok.log -ErrorAction SilentlyContinue
        exit 1

    - name: Keep Session Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
