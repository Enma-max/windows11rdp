name: RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Administrator@123'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Password
      run: |
        $password = "${{ github.event.inputs.password }}" | ConvertTo-SecureString -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

    - name: Download Ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip" -OutFile ngrok.zip
        Expand-Archive -Path ngrok.zip -DestinationPath .

    - name: Start Ngrok
      run: |
        .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 5

    - name: Get RDP Info
      run: |
        $retries = 0
        $maxRetries = 10
        $tunnel = $null
        
        while ($retries -lt $maxRetries -and $tunnel -eq $null) {
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:4040/api/tunnels" -UseBasicParsing -ErrorAction Stop
            $data = $response.Content | ConvertFrom-Json
            $tunnel = $data.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
          } catch {
            $retries++
            Start-Sleep -Seconds 3
          }
        }
        
        if ($tunnel -ne $null) {
          $public_url = $tunnel.public_url
          $host_port = $public_url -replace "tcp://", ""
          $host = ($host_port -split ":")[0]
          $port = ($host_port -split ":")[1]
          
          Write-Host "========================================="
          Write-Host "RDP INFO:"
          Write-Host "Host: $host"
          Write-Host "Port: $port"
          Write-Host "User: runneradmin"
          Write-Host "Pass: ${{ github.event.inputs.password }}"
          Write-Host "========================================="
          Write-Host "Connection String: $host:$port"
        } else {
          Write-Host "========================================="
          Write-Host "ERROR: Ngrok tunnel not found."
          Write-Host "========================================="
          exit 1
        }

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 3600 }
