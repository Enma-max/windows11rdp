name: RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Administrator@123'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Password
      run: |
        $password = "${{ github.event.inputs.password }}" | ConvertTo-SecureString -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

    - name: Download Ngrok (Latest)
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/a/dc9Wde74r2k/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
        Expand-Archive -Path ngrok.zip -DestinationPath .

    - name: Start Ngrok
      run: |
        .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        .\ngrok.exe tcp 3389 --log=stdout > ngrok.log 2>&1 &
        Start-Sleep -Seconds 10

    - name: Get RDP Info
      run: |
        Write-Host "========================================="
        Write-Host "Checking ngrok.log for tunnel URL..."
        Get-Content ngrok.log
        Write-Host "========================================="
        Write-Host "Look for the line that says:"
        Write-Host "tcp://0.tcp.ngrok.io:12345"
        Write-Host "========================================="
        Write-Host "User: runneradmin"
        Write-Host "Pass: ${{ github.event.inputs.password }}"
        Write-Host "========================================="

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 3600 }
