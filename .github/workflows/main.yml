name: RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Administrator@123'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Password
      run: |
        $password = "${{ github.event.inputs.password }}" | ConvertTo-SecureString -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

    - name: Download Ngrok v3
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/a/dc9dde74n2/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
        Expand-Archive -Path ngrok.zip -DestinationPath .

    - name: Start Ngrok
      run: |
        .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 8

    - name: Get RDP Info
      run: |
        $url = "http://localhost:4040/api/tunnels"
        try {
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing
          $data = $response.Content | ConvertFrom-Json
          $tcp = $data.tunnels | Where-Object { $_.proto -eq "tcp" }
          if ($tcp) {
            $addr = $tcp.public_url -replace "tcp://", ""
            Write-Host "========================================="
            Write-Host "RDP INFO:"
            Write-Host "Address: $addr"
            Write-Host "User: runneradmin"
            Write-Host "Pass: ${{ github.event.inputs.password }}"
            Write-Host "========================================="
          } else {
            Write-Host "No TCP tunnel found. Check ngrok logs."
          }
        } catch {
          Write-Host "Error getting tunnel info. Check ngrok is running."
        }

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 3600 }
