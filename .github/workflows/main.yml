name: RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Administrator@123'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Password
      run: |
        $password = "${{ github.event.inputs.password }}" | ConvertTo-SecureString -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

    - name: Download Ngrok
      run: |
        curl -L -o ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip
        Expand-Archive -Path ngrok.zip -DestinationPath .

    - name: Start Ngrok
      run: |
        .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 10

    - name: Get RDP Info
      run: |
        $retries = 0
        $tunnel = $null
        while ($retries -lt 15 -and $tunnel -eq $null) {
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:4040/api/tunnels" -UseBasicParsing
            $data = $response.Content | ConvertFrom-Json
            $tunnel = $data.tunnels | Where-Object { $_.proto -eq "tcp" }
          } catch {
            $retries++
            Start-Sleep -Seconds 3
          }
        }
        if ($tunnel) {
          $addr = $tunnel.public_url -replace "tcp://", ""
          Write-Host "========================================="
          Write-Host "RDP INFO:"
          Write-Host "Address: $addr"
          Write-Host "User: runneradmin"
          Write-Host "Pass: ${{ github.event.inputs.password }}"
          Write-Host "========================================="
        } else {
          Write-Host "Tunnel not found. Check ngrok logs."
        }

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 3600 }
