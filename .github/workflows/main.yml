name: RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Administrator@123'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Password
      run: |
        $password = "${{ github.event.inputs.password }}" | ConvertTo-SecureString -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

    - name: Download Ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip" -OutFile ngrok.zip
        Expand-Archive -Path ngrok.zip -DestinationPath .

    - name: Start Ngrok
      run: |
        .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -WindowStyle Hidden

    - name: Get RDP Info
      run: |
        Start-Sleep -Seconds 15
        $ngrok_api = Invoke-WebRequest -Uri "http://localhost:4040/api/tunnels" -UseBasicParsing | ConvertFrom-Json
        $public_url = $ngrok_api.tunnels[0].public_url
        $ip_port = $public_url -replace "tcp://", ""
        Write-Host "========================================="
        Write-Host "RDP INFO:"
        Write-Host "Address: $ip_port"
        Write-Host "User: runneradmin"
        Write-Host "Pass: ${{ github.event.inputs.password }}"
        Write-Host "========================================="

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 3600 }
